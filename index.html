
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kas Pribadi</title>
    <!-- Include SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --success-hover: #059669;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --warning: #F59E0B;
            --info: #3B82F6;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
            margin: 0;
        }

        .btn-download {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: var(--success-hover);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .summary-card.balance {
            background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
            grid-column: 1 / -1; 
        }
        
        .summary-card.income {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }

        .summary-card.expense {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }

        .summary-card h2 {
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .summary-card .total {
            font-size: 24px;
            font-weight: bold;
        }

        .filter-section {
            background-color: #F9FAFB;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            margin-bottom: 25px;
        }

        .filter-header {
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 10px;
            display: block;
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            font-size: 12px;
            color: #6B7280;
        }

        .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .form-container {
            background-color: #F9FAFB;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            margin-bottom: 25px;
        }

        .form-container h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #4B5563;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.2s;
            flex: 1;
        }

        button.btn-income { background-color: var(--success); }
        button.btn-income:hover { background-color: var(--success-hover); }

        button.btn-expense { background-color: var(--danger); }
        button.btn-expense:hover { background-color: var(--danger-hover); }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #E5E7EB;
        }

        th {
            background-color: #F9FAFB;
            font-weight: 600;
            color: #4B5563;
        }
        
        .type-income { color: var(--success); font-weight: 600; }
        .type-expense { color: var(--danger); font-weight: 600; }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background-color: #E5E7EB;
            color: #374151;
        }

        .category-makan { background-color: #FDE68A; color: #92400E; }
        .category-minum { background-color: #BAE6FD; color: #0284C7; }
        .category-jajan { background-color: #FECACA; color: #991B1B; }
        .category-kesehatan { background-color: #A7F3D0; color: #065F46; }
        .category-kuliah { background-color: #BFDBFE; color: #1E40AF; }
        .category-transportasi { background-color: #E9D5FF; color: #6B21A8; }
        .category-pemasukan { background-color: #D1FAE5; color: #065F46; }
        .category-lainnya { background-color: #F3F4F6; color: #374151; }

        .btn-delete {
            background-color: #F3F4F6;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #6B7280;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header-actions { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-download { justify-content: center; }
            .date-range { flex-direction: column; align-items: stretch; gap: 5px;}
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-actions">
            <h1>Buku Kas Pribadi</h1>
            <button class="btn-download" onclick="exportToExcel()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Data (Excel)
            </button>
        </div>
        
        <div class="filter-section">
            <span class="filter-header">Filter Data:</span>
            <div class="filter-controls">
                <div class="filter-group">
                    <label>Rentang Waktu Cepat</label>
                    <select id="time-filter" onchange="handleTimeFilterChange()">
                        <option value="all">Semua Waktu</option>
                        <option value="this_week">Minggu Ini</option>
                        <option value="this_month">Bulan Ini</option>
                        <option value="custom">Pilih Rentang Tanggal...</option>
                    </select>
                </div>
                
                <div class="filter-group" id="custom-date-group" style="display: none; flex: 2;">
                    <label>Rentang Tanggal Khusus</label>
                    <div class="date-range">
                        <input type="date" id="filter-start-date" onchange="renderData()">
                        <span style="color: #6B7280;">sd</span>
                        <input type="date" id="filter-end-date" onchange="renderData()">
                    </div>
                </div>

                <div class="filter-group">
                    <label>Kategori</label>
                    <select id="category-filter" onchange="renderData()">
                        <option value="all">Semua Kategori</option>
                        <option value="Makan">Makan</option>
                        <option value="Minum">Minum</option>
                        <option value="Jajan">Jajan</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Kebutuhan Kuliah">Kebutuhan Kuliah</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Pemasukan">Pemasukan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="summary-card balance">
                <h2 id="balance-title">Sisa Uang (Sesuai Filter)</h2>
                <div class="total" id="total-balance">Rp 0</div>
            </div>
            <div class="summary-card income">
                <h2>Total Pemasukan</h2>
                <div class="total" id="total-income">Rp 0</div>
            </div>
            <div class="summary-card expense">
                <h2>Total Pengeluaran</h2>
                <div class="total" id="total-expense">Rp 0</div>
            </div>
        </div>

        <div class="form-container">
            <h3>Catat Transaksi Baru</h3>
            <form id="transaction-form">
                <div class="form-row">
                    <input type="date" id="date" required>
                    <input type="number" id="amount" placeholder="Jumlah (Rp)" required min="1">
                </div>
                <div class="form-row">
                    <select id="category" required>
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="Makan">Makan</option>
                        <option value="Minum">Minum</option>
                        <option value="Jajan">Jajan</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Kebutuhan Kuliah">Kebutuhan Kuliah</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Pemasukan">Pemasukan (Gaji/Uang Saku)</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                    <input type="text" id="desc" placeholder="Keterangan Tambahan (Opsional)">
                </div>
                <div class="btn-group" style="margin-top: 15px;">
                    <button type="button" class="action-btn btn-income" onclick="addTransaction('income')">+ Tambah Pemasukan</button>
                    <button type="button" class="action-btn btn-expense" onclick="addTransaction('expense')">- Tambah Pengeluaran</button>
                </div>
            </form>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Kategori</th>
                        <th>Keterangan</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </div>
        <div id="empty-message" class="empty-state" style="display: none;">Belum ada data transaksi untuk filter ini.</div>
    </div>

    <script>
        // Inisialisasi Data
        let transactions = JSON.parse(localStorage.getItem('kas_transactions')) || [];
        
        // Elemen DOM Form
        const dateInput = document.getElementById('date');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const categoryInput = document.getElementById('category');
        
        // Elemen DOM Filter
        const timeFilterSelect = document.getElementById('time-filter');
        const customDateGroup = document.getElementById('custom-date-group');
        const filterStartDate = document.getElementById('filter-start-date');
        const filterEndDate = document.getElementById('filter-end-date');
        const categoryFilterSelect = document.getElementById('category-filter');
        
        // Set tanggal hari ini untuk input baru
        dateInput.valueAsDate = new Date();
        
        // Default rentang tanggal kustom (awal bulan sampai hari ini)
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        filterStartDate.valueAsDate = firstDay;
        filterEndDate.valueAsDate = today;

        // Format Rupiah
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        };

        // Class Badge Kategori
        const getCategoryBadgeClass = (category) => {
            const map = {
                'Makan': 'category-makan',
                'Minum': 'category-minum',
                'Jajan': 'category-jajan',
                'Kesehatan': 'category-kesehatan',
                'Kebutuhan Kuliah': 'category-kuliah',
                'Transportasi': 'category-transportasi',
                'Pemasukan': 'category-pemasukan',
                'Lainnya': 'category-lainnya'
            };
            return map[category] || 'category-lainnya';
        };

        // Handle perubahan dropdown filter waktu
        window.handleTimeFilterChange = () => {
            if (timeFilterSelect.value === 'custom') {
                customDateGroup.style.display = 'flex';
            } else {
                customDateGroup.style.display = 'none';
            }
            renderData();
        };

        // Logika Filter
        const getFilteredTransactions = () => {
            const timeFilter = timeFilterSelect.value;
            const catFilter = categoryFilterSelect.value;
            
            return transactions.filter(t => {
                // 1. Filter Kategori
                if (catFilter !== 'all' && t.category !== catFilter) {
                    return false;
                }

                // 2. Filter Waktu
                if (timeFilter === 'all') return true;
                
                const d = new Date(t.date);
                d.setHours(0, 0, 0, 0); // Normalisasi waktu
                
                const now = new Date();
                
                if (timeFilter === 'this_month') {
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }
                
                if (timeFilter === 'this_week') {
                    const day = now.getDay() || 7; 
                    if (day !== 1) now.setHours(-24 * (day - 1));
                    now.setHours(0, 0, 0, 0);
                    
                    const start = new Date(now);
                    const end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    end.setHours(23, 59, 59, 999);
                    
                    return d >= start && d <= end;
                }
                
                if (timeFilter === 'custom') {
                    const start = new Date(filterStartDate.value);
                    start.setHours(0, 0, 0, 0);
                    
                    const end = new Date(filterEndDate.value);
                    end.setHours(23, 59, 59, 999);
                    
                    return d >= start && d <= end;
                }
                
                return true;
            }).sort((a, b) => new Date(b.date) - new Date(a.date)); // Sortir terbaru
        };

        // Tambah Transaksi
        window.addTransaction = (type) => {
            const date = dateInput.value;
            const desc = descInput.value;
            const amount = parseFloat(amountInput.value);
            const category = categoryInput.value;

            if (!date || !amount || !category) {
                alert("Harap isi Tanggal, Kategori, dan Jumlah!");
                return;
            }

            if (type === 'expense' && category === 'Pemasukan') {
                alert("Kategori 'Pemasukan' hanya untuk Tambah Pemasukan!");
                return;
            }
            if (type === 'income' && category !== 'Pemasukan' && category !== 'Lainnya') {
                if(!confirm("Anda memilih kategori pengeluaran tapi menambahkannya sebagai Pemasukan. Lanjutkan?")) {
                    return;
                }
            }

            transactions.push({ 
                id: Date.now(), 
                date, 
                category,
                desc, 
                amount,
                type 
            });
            
            localStorage.setItem('kas_transactions', JSON.stringify(transactions));
            
            // Reset form
            descInput.value = '';
            amountInput.value = '';
            categoryInput.value = '';
            
            renderData();
        };

        // Hapus Transaksi
        window.deleteTransaction = (id) => {
            if(confirm("Hapus transaksi ini?")) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('kas_transactions', JSON.stringify(transactions));
                renderData();
            }
        };

        // Export ke Excel (Menyimpan data sesuai filter aktif)
        window.exportToExcel = () => {
            const filteredData = getFilteredTransactions();
            
            if(filteredData.length === 0) {
                alert("Tidak ada data untuk di-download pada filter ini.");
                return;
            }

            // Siapkan data untuk Excel
            const excelData = filteredData.map(t => ({
                'Tanggal': t.date,
                'Jenis': t.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
                'Kategori': t.category,
                'Keterangan': t.desc || '-',
                'Nominal': t.amount
            }));

            // Menggunakan SheetJS (XLSX)
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Kas");
            
            // Nama file dinamis
            const fileName = `Buku_Kas_${new Date().toISOString().slice(0,10)}.xlsx`;
            
            // Download
            XLSX.writeFile(workbook, fileName);
        };

        // Render Data ke Layar
        window.renderData = () => {
            const listEl = document.getElementById('transaction-list');
            const emptyEl = document.getElementById('empty-message');
            
            const filteredTransactions = getFilteredTransactions();

            listEl.innerHTML = '';
            let totalIncome = 0;
            let totalExpense = 0;

            filteredTransactions.forEach(t => {
                if(t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.date}</td>
                    <td><span class="category-badge ${getCategoryBadgeClass(t.category)}">${t.category}</span></td>
                    <td>${t.desc || '-'}</td>
                    <td class="${t.type === 'income' ? 'type-income' : 'type-expense'}">
                        ${t.type === 'income' ? '+' : '-'}${formatRupiah(t.amount)}
                    </td>
                    <td><button class="btn-delete" onclick="deleteTransaction(${t.id})">Hapus</button></td>
                `;
                listEl.appendChild(tr);
            });

            // Tampilkan Empty State
            if(filteredTransactions.length === 0) {
                emptyEl.style.display = 'block';
            } else {
                emptyEl.style.display = 'none';
            }

            // Update Dashboard
            document.getElementById('total-income').innerText = formatRupiah(totalIncome);
            document.getElementById('total-expense').innerText = formatRupiah(totalExpense);
            document.getElementById('total-balance').innerText = formatRupiah(totalIncome - totalExpense); // SISA UANG
        };

        // Jalankan saat pertama load
        renderData();
    </script>
</body>
</html>
